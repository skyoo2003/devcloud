# Zero-config defaults.
#
# There is deliberately no `services:` block: every registered service starts
# with data_dir ./data/<service>. Add a services block to run a subset — it is
# authoritative, so only the services it lists start. Use DEVCLOUD_SERVICES for
# a quick subset without a file, and DEVCLOUD_DATA_DIR to relocate the data
# directories.
server:
  port: 4747

admin:
  enabled: false

logging:
  level: info
  format: text
