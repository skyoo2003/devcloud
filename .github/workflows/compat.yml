name: Compatibility Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"

      # CGO_ENABLED=0 is the mode .goreleaser.yaml publishes, so these tests
      # double as the smoke test for the binary users actually download.
      - name: Build devcloud binary
        run: CGO_ENABLED=0 go build -o dist/devcloud ./cmd/devcloud

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r tests/compatibility/requirements.txt

      - name: Run compatibility tests
        run: pytest tests/compatibility/ -v --tb=short
        env:
          DEVCLOUD_BIN: dist/devcloud
