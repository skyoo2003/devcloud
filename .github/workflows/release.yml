name: Release

on:
  push:
    tags:
    - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.2.0)'
        required: true
        type: string
      dry_run:
        description: 'Skip publishing (dry run)'
        required: false
        type: boolean
        default: true

# Single source of truth for the Homebrew tap location: the token-minting step
# scopes itself to it, and .goreleaser.yaml reads both from the environment.
env:
  HOMEBREW_TAP_OWNER: ${{ github.repository_owner }}
  HOMEBREW_TAP_REPO: homebrew-tap

jobs:
  # CI triggers on a tag push too, but the two workflows race — nothing stops
  # GoReleaser from publishing binaries, images and a Homebrew formula off a red
  # commit. This job is what makes the tag wait.
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout the code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
        cache-dependency-path: go.sum
    - name: Install SQLite dev headers
      run: sudo apt-get install -y libsqlite3-dev
    - name: Run Go tests
      run: CGO_ENABLED=1 go test ./...

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      attestations: write
    steps:
    - name: Checkout the code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      with:
        fetch-depth: 0
    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
        cache-dependency-path: go.sum
    - name: Resolve tag
      id: resolve_tag
      run: |
        echo "tag=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"
        if [[ "${{ github.event.inputs.dry_run }}" == "true" ]]; then
          echo "extra_flags=--snapshot" >> "$GITHUB_OUTPUT"
        fi
    - name: Verify changie release notes
      run: |
        notes="changes/${{ steps.resolve_tag.outputs.tag }}.md"
        if [ ! -f "$notes" ]; then
          echo "::error::Changie fragment $notes not found."
          echo "::error::Run 'changie batch ${{ steps.resolve_tag.outputs.tag }}' and 'changie merge' before pushing the tag."
          exit 1
        fi
        # 'changie batch' does not validate custom fields on hand-written
        # fragments, so an empty Issue renders as ([#](.../issues/)) and ships
        # as a dead link in the release notes.
        if grep -n 'issues/)' "$notes"; then
          echo "::error::The lines above have no issue number. Fix the Issue field in their changes/unreleased fragment, then re-batch."
          exit 1
        fi
    - name: Set up Docker Buildx
      if: ${{ github.event.inputs.dry_run != 'true' }}
      uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
    - name: Login to GitHub Container Registry
      if: ${{ github.event.inputs.dry_run != 'true' }}
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    # Short-lived token scoped to the tap repository only, for the brews
    # section. Skipped on a dry run, where GoReleaser never publishes it.
    - name: Mint a Homebrew tap token
      id: tap_token
      if: ${{ github.event.inputs.dry_run != 'true' }}
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      with:
        app-id: ${{ secrets.TAP_APP_ID }}
        private-key: ${{ secrets.TAP_APP_PRIVATE_KEY }}
        owner: ${{ env.HOMEBREW_TAP_OWNER }}
        repositories: ${{ env.HOMEBREW_TAP_REPO }}
    - name: Execute GoReleaser
      uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94  # goreleaser-action v7
      with:
        distribution: goreleaser
        version: "~> v2"
        args: release --clean ${{ steps.resolve_tag.outputs.extra_flags }} --release-notes changes/${{ steps.resolve_tag.outputs.tag }}.md
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Always defined: {{ .Env.HOMEBREW_TAP_TOKEN }} fails to render if the
        # variable is missing. On a dry run the minting step is skipped, and the
        # placeholder is never used because --snapshot publishes nothing.
        HOMEBREW_TAP_TOKEN: ${{ steps.tap_token.outputs.token || 'dry-run' }}
    - name: Upload assets
      if: ${{ github.event.inputs.dry_run != 'true' }}
      uses: actions/upload-artifact@v7
      with:
        name: devcloud
        path: dist/*
