name: Smithy Model Sync

on:
  schedule:
    - cron: "0 0 * * 1"  # Every Monday at midnight UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6
        with:
          go-version: "1.26"

      - name: Download latest Smithy models
        # --refresh re-downloads the committed models; without it every model
        # already in the tree is skipped and this job can never find a change.
        run: bash scripts/download-smithy-models.sh --refresh

      - name: Run code generation
        run: |
          go run ./cmd/codegen \
            -models ./smithy-models \
            -output ./internal/generated \
            -templates ./internal/codegen/templates \
            -scaffold-output ./internal/services

      - name: Regenerate imports
        run: bash scripts/generate-imports.sh

      - name: Check for changes
        id: changes
        # --porcelain rather than `git diff --quiet` so a newly generated
        # package (an untracked directory) counts as a change instead of being
        # silently dropped on the runner.
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      # continue-on-error, not a gate: this suite includes the published-figure
      # gate in cmd/devcloud/coverage_test.go, which an upstream model that gains
      # a single operation is *designed* to fail. Ending the job here would skip
      # Create Pull Request and discard the refreshed models with the runner —
      # so the only sync worth reviewing would be the only one nobody ever sees.
      # The failure is not swallowed; it is re-raised below, after the PR exists.
      - name: Run tests
        id: tests
        if: steps.changes.outputs.changed == 'true'
        continue-on-error: true
        run: CGO_ENABLED=0 go test ./... -v

      # The diff is whole-tree whether upstream moved one model or ninety — a
      # real refresh measured on 2026-09-06 changed 93 models and 134 generated
      # files. Asking a reviewer to "review" that is asking for nothing. This
      # reduces it to the question they actually have: which operations moved.
      - name: Summarise the churn
        if: steps.changes.outputs.changed == 'true'
        run: |
          {
            echo "Automated weekly sync of AWS Smithy models from \`aws-sdk-go-v2\`."
            echo
            echo "**In-job test result: \`${{ steps.tests.outcome }}\`.**"
            echo
            echo "A \`failure\` is expected when upstream added or removed an"
            echo "operation: the published-figure gate over \`docs/coverage.md\` fails"
            echo "on purpose so a human looks at a coverage change. Re-derive the"
            echo "figures and correct the doc in this PR — do not silence the gate."
            echo
            echo "This PR's own \`ci\`, \`compat\` and \`codegen-drift\` runs are the"
            echo "gate on merging."
            echo
            echo "---"
            echo
            python3 scripts/model_churn.py --upstream
            echo
            echo "<sub>Summary from \`scripts/model_churn.py\`; re-derive with"
            echo "\`python3 scripts/model_churn.py --upstream\`.</sub>"
          } > /tmp/sync-pr-body.md
          cat /tmp/sync-pr-body.md
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Create Pull Request
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          commit-message: "chore: sync Smithy models and regenerate code"
          title: "chore: weekly Smithy model sync"
          body-path: /tmp/sync-pr-body.md
          branch: smithy-sync/weekly
          delete-branch: true

      # The PR now exists, so the failure can end the job. Without this the cron
      # would report success every week no matter what upstream did — the same
      # silent no-op scripts/download-smithy-models.sh was fixed to stop doing,
      # traded for the one continue-on-error just removed.
      - name: Fail if the sync's tests failed
        if: steps.tests.outcome == 'failure'
        run: |
          echo "::error::Smithy sync tests failed; see the PR opened by this run."
          exit 1
