name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"

      - name: Install SQLite dev headers
        run: sudo apt-get install -y libsqlite3-dev

      - name: Run Go tests
        # ./... rather than ./internal/... so cmd/devcloud's ServicePlugin
        # conformance test runs in CI too.
        run: CGO_ENABLED=1 go test ./... -v
        env:
          CGO_ENABLED: "1"

      - name: Build Go binaries
        run: |
          CGO_ENABLED=1 go build -o dist/devcloud ./cmd/devcloud
          CGO_ENABLED=1 go build -o dist/codegen ./cmd/codegen
