kind: Removed
body: Remove dead surface found by a repo-wide over-engineering audit — the in-memory event bus and the admin WebSocket at `/devcloud/api/ws` (no code could ever publish an event, so the socket accepted connections and sent nothing), the `GetMetrics`/`ServiceMetrics` plugin API and the `/devcloud/api/metrics` endpoints (100 of 103 services returned zero-valued metrics; resource counts remain on `/devcloud/api/services`), the unused generic `shared.ResourceStore`, `gateway.ExtractAccountID` (it returned a constant and had no callers), and the `auth.enabled` key whose only effect was a startup warning that it was unimplemented (the key is still read for one release so that enabling it warns that credentials are accepted regardless, rather than being ignored in silence). Drops the `gorilla/websocket` dependency.
time: 2026-07-30T00:00:00.000000+09:00
