kind: Fixed
body: Unimplemented operations now return an `InvalidAction` error (HTTP 400) instead of a misleading empty `200` success, so SDKs no longer see a false success (affects glue, sagemaker, iot, backup, codebuild, codedeploy, codepipeline, cognito-idp, configservice, apigatewayv2, iotwireless)
