kind: Added
body: 'Per-provider auth adapters (`internal/auth`): SigV4 credentials are parsed once and the caller''s claimed identity — access key, region, signing name, session token — is available to every plugin via `auth.FromContext`, and reported as a new `region` field on `GET /devcloud/api/logs`. Nothing is verified; DevCloud still accepts any credentials'
