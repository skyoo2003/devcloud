kind: Changed
body: The `services` config block is now optional. Omit it — as the embedded default now does — and every registered service starts with `data_dir ./data/<service>`; listing services still restricts startup to exactly that set. This replaces a 325-line default file in which all 103 entries were identical boilerplate.
