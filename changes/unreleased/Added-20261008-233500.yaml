kind: Added
body: Complete Phase 1B core identity and access integrations by adding native operations for IAM (MFA devices, password changes, service credentials, SSH/server/signing certificates, OIDC provider client IDs, delegation requests, access/credential reports, policy simulation, and org root credentials/sessions) and STS (AssumeRoleWithWebIdentity, AssumeRoleWithSAML, AssumeRoot, DecodeAuthorizationMessage, GetDelegatedAccessToken, GetFederationToken, GetWebIdentityToken).
