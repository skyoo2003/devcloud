kind: Added
body: Implement Phase 1C compute and network integrations by adding aws.protocols#ec2Query protocol detection in codegen parser, CRUD fallback engine XML response support with requestId and item list element wrappers, gateway error routing for ec2-query, and wiring EC2 unhandled operations into the fallback CRUD engine, promoting 498 EC2 operations to auto-crud.
