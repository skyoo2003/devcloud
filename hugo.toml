  [[menu.after]]
    name = 'GitHub'
    url = 'https://github.com/skyoo2003/devcloud'
    weight = 10
  [[menu.after]]
    name = 'Changelog'
    url = 'https://github.com/skyoo2003/devcloud/blob/main/CHANGELOG.md'
