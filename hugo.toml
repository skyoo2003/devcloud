    weight = 90
  [[menu.before]]
    identifier = 'roadmap'
    pageRef = '/roadmap'
    weight = 100
  [[menu.before]]
    identifier = 'faq'
    pageRef = '/faq'
    weight = 110
  [[menu.before]]
    identifier = 'troubleshooting'
    pageRef = '/troubleshooting'
