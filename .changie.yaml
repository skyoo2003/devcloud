changesDir: changes
unreleasedDir: unreleased
headerPath: header.tpl.md
changelogPath: CHANGELOG.md
versionExt: md
versionFormat: '## [{{ .Version }}](https://github.com/skyoo2003/devcloud/releases/tag/{{ .Version }}) - {{ .Time.Format "2006-01-02" }}'


kindFormat: "### {{ .Kind }}"
changeFormat: "* {{ .Body }} ([#{{ .Custom.Issue }}](https://github.com/skyoo2003/devcloud/issues/{{ .Custom.Issue }}))"
kinds:
  - label: Added
  - label: Changed
  - label: Deprecated
  - label: Removed
  - label: Fixed
  - label: Security
  - label: Documentation
body:
  # A ceiling, not a target: one sentence is the rule (see RELEASE.md), and a
  # body this long is a paragraph that belongs in the linked issue. Enforced by
  # `changie new` only — a hand-written fragment is not checked.
  maxLength: 400
custom:
  - key: Issue
    label: Issue Number
    type: int
    minInt: 1
